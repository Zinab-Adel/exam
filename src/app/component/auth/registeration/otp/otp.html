<div>
  <h2 class="font-bold text-xl">Create Account</h2>
  <h2 class="font-bold text-md text-blue-600 py-2">Verify OTP</h2>
  <P class="text-sm pb-2">Please enter the 6-digits code we have sent to: <br> user@example.com.
      <a href="#" class="text-blue-600">Edit</a></P>
    <div class="w-full py-2">
        <div class="card flex justify-center">
            <p-inputotp [(ngModel)]="otpValue" [length]="6"/>
        </div>
        <p-button type="submit" label="send" iconPos="right" variant="outlined" severity="info" (click)="submit()"
                    styleClass="w-full mt-3" />
         <div class="timer-container">
            @if (timeLeft() > 0) {
                <p class="mx-0 text-sm mt-3">You can request another code in: {{ timeLeft() }}s</p>
            } @else {
                <p-button type="submit" label="Resend Code" iconPos="right" variant="outlined" severity="info"
                    styleClass="w-full mt-3" />
            }
        </div>
    </div>
</div>
