<div class="flex flex-col gap-6 p-6 w-full max-w-md mx-auto">
  
  <div class="flex flex-col gap-2">
    <label class="text-gray-700 font-semibold text-sm">
      Password<span class="text-red-500 ml-1">*</span>
    </label>
    <p-password 
      [ngModel]="password()"
      (ngModelChange)="password.set($event)"
      (onBlur)="showPasswordError.set(true)"
      [toggleMask]="true" 
      [feedback]="false" 
      placeholder="********"
      styleClass="w-full"
      inputStyleClass="w-full p-3 border border-gray-300 rounded-md focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-all"
    ></p-password>
  </div>

    @if(showPasswordError() && password() && !passwordValid()){
      <small class="text-red-500">
        Password must be at least 8 characters and contain one uppercase letter.
      </small>
    }

  <div class="flex flex-col gap-2">
    <label class="text-gray-700 font-semibold text-sm">
      Confirm Password<span class="text-red-500 ml-1">*</span>
    </label>
    <p-password 
      [ngModel]="confirmPassword()" 
      (ngModelChange)="confirmPassword.set($event)"
      (onBlur)="showConfirmPasswordError.set(true)"
      [toggleMask]="true" 
      [feedback]="false" 
      placeholder="********"
      styleClass="w-full"
      inputStyleClass="w-full p-3 border border-gray-300 rounded-md focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-all"
    ></p-password>
  </div>

    @if(showConfirmPasswordError() && confirmPassword() && !passwordMatch()){
      <small class="text-red-500">
       Passwords do not match.
      </small>
    }

  <div class="mt-4">
    <button 
      (click)="submit()"
      [disabled]="!passwordValid() || !passwordMatch()"
      class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-md shadow-sm transition-colors duration-200"
    >
      Create Account
    </button>
  </div>

</div>
