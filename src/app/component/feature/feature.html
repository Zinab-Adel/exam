<div class="flex min-h-screen w-full bg-white">
<aside class="flex flex-col w-72 h-screen bg-[#EDF3F9] border-r border-slate-200 shadow-sm sticky top-0">    
    <div class="p-8">
      <div class="flex flex-col">
        <h1 class="text-3xl font-extrabold text-[#3A3A3A] tracking-tight mb-1">ELEVATE</h1>
        <div class="flex items-center gap-2">
          <div class="bg-[#1E5EF3] p-1 rounded flex items-center justify-center">
              <i class="pi pi-code text-white text-[10px]"></i>
          </div>
          <span class="text-[#1E5EF3] font-bold text-sm tracking-wide">Exam App</span>
        </div>
      </div>
    </div>

    <nav class="flex-1 px-4 space-y-1">
      
      <a (click)="setActive('diplomas')"
        [routerLink]="['/diplomas']"
        [ngClass]="activeItem() === 'diplomas' 
            ? 'bg-[#D6E9FF] text-[#1E5EF3] shadow-sm' 
            : 'text-slate-500 hover:bg-white/50 hover:text-slate-700'"
        class="flex items-center gap-4 px-5 py-3.5 rounded-xl transition-all duration-200 cursor-pointer group">
        <i class="pi pi-graduation-cap text-lg" 
          [ngClass]="activeItem() === 'diplomas' ? 'text-[#1E5EF3]' : 'text-slate-400 group-hover:text-slate-600'">
        </i>
        <span class="font-semibold">Diplomas</span>
      </a>

      <a (click)="setActive('settings')"
        [routerLink]="['/settings']"
        [ngClass]="activeItem() === 'settings' 
            ? 'bg-[#D6E9FF] text-[#1E5EF3] shadow-sm' 
            : 'text-slate-500 hover:bg-white/50 hover:text-slate-700'"
        class="flex items-center gap-4 px-5 py-3.5 rounded-xl transition-all duration-200 cursor-pointer group">
        <i class="pi pi-user text-lg"
          [ngClass]="activeItem() === 'settings' ? 'text-[#1E5EF3]' : 'text-slate-400 group-hover:text-slate-600'">
        </i>
        <span class="font-semibold">Account Settings</span>
      </a>

    </nav>

    <div class="p-4 border-t border-slate-200 bg-[#F4F8FC]">
      <div class="flex items-center gap-3 p-2 rounded-xl hover:bg-white transition-all cursor-pointer group">
        
        <p-avatar 
          [image]="userData()?.user?.username" 
          size="large" 
          shape="square"
          styleClass="shadow-sm border border-slate-200">
        </p-avatar>

        <div class="flex flex-col flex-1 min-w-0">
          <span class="text-sm font-bold text-slate-800 truncate">{{ userData()?.user?.firstName }}</span>
          <span class="text-[11px] text-slate-500 truncate lowercase">{{ userData()?.user?.email }}</span>
        </div>

        <button class="text-slate-400 hover:text-slate-600 p-1">
          <i class="pi pi-ellipsis-v text-xs"></i>
        </button>
      </div>
    </div>

  </aside>
  <main class="flex-1 h-screen overflow-y-auto bg-white p-6">
    <div class="mb-4 py-2 px-1">
      <app-breadcrumb></app-breadcrumb>
</div>
    <router-outlet></router-outlet>
  </main>
</div>
